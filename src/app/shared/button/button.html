<ng-template #label><ng-content></ng-content></ng-template>

@if (link(); as targetLink) {
  <a [class]="buttonClasses()" [routerLink]="targetLink">
    <ng-container [ngTemplateOutlet]="label"></ng-container>
  </a>
} @else {
  <button [class]="buttonClasses()" [type]="type()" [disabled]="disabled()">
    <ng-container [ngTemplateOutlet]="label"></ng-container>
  </button>
}
