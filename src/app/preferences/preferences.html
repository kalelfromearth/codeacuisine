<app-header background="light"></app-header>

<main class="preferences">
  <div class="wrapper preferences__content">
    <a class="preferences__back-link" routerLink="/generate-recipe" aria-label="Back to ingredients">
      <span class="preferences__back-arrow" aria-hidden="true"></span>
      Ingredients
    </a>
    <h1 class="preferences__title">Choose your preferences</h1>

    <form class="preferences__form" [formGroup]="preferencesForm" novalidate>
      <div class="preferences__steppers">
        <app-stepper
          label="How many portions you need?"
          [control]="preferencesForm.controls.servings"
          [min]="minServings"
          [max]="maxServings"
          unitSingular="Portion"
          unitPlural="Portions"
        ></app-stepper>
        <app-stepper
          label="How many are cooking?"
          [control]="preferencesForm.controls.cooks"
          [min]="minCooks"
          [max]="maxCooks"
          unitSingular="Person"
          unitPlural="Persons"
          [bubbleValue]="maxCooks"
          bubbleText="WOW! Extreme cooking, yeah!"
        ></app-stepper>
      </div>

      <div class="preferences__panel">
        <app-chip-group
          legend="Cooking time:"
          iconPath="images/icons/schedule.svg"
          [options]="timeOptions"
          [control]="preferencesForm.controls.timeCategory"
        ></app-chip-group>
        <app-chip-group
          legend="Cuisine"
          iconPath="images/icons/world.svg"
          [options]="cuisineOptions"
          [control]="preferencesForm.controls.cuisine"
        ></app-chip-group>
        <app-chip-group
          legend="Diet preferences"
          iconPath="images/icons/fork_spoon.svg"
          [options]="dietOptions"
          [control]="preferencesForm.controls.diet"
        ></app-chip-group>
      </div>

      <div class="preferences__submit">
        <app-button variant="light" (click)="generateRecipe()">Generate a recipe</app-button>
      </div>
    </form>
  </div>
</main>
