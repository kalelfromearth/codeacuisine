<a class="skip-link" href="#main" (click)="skipToContent($event)">Skip to content</a>
@if (loadError.hasLoadError()) {
  <div class="load-error" role="alert">
    <p class="load-error__text">We could not load this page. Please check your connection and try again.</p>
    <button class="load-error__button" type="button" (click)="loadError.reloadPage()">Try again</button>
  </div>
}
<router-outlet />
<footer class="site-footer">
  <nav class="wrapper site-footer__content" aria-label="Legal">
    <a class="site-footer__link" routerLink="/imprint">Imprint</a>
    <a class="site-footer__link" routerLink="/privacy">Privacy policy</a>
  </nav>
</footer>
