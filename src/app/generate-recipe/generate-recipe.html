<app-header background="light"></app-header>

<main class="generate-recipe">
  <div class="wrapper generate-recipe__content">
    <h1 class="generate-recipe__title">Generate recipe</h1>
    <p class="generate-recipe__intro">
      Got random stuff in your kitchen? Pop it in—we’ve got the perfect recipe waiting.
    </p>
    <div class="generate-recipe__cards">
      <app-ingredient-form class="generate-recipe__card generate-recipe__card--wide"></app-ingredient-form>
      <app-ingredient-list class="generate-recipe__card"></app-ingredient-list>
    </div>
    <div class="generate-recipe__actions">
      <app-button variant="secondary" (click)="goToNextStep()">Next step</app-button>
    </div>
  </div>
</main>

<app-popup
  heading="Ups! Not quite enough..."
  [isOpen]="isNotEnoughPopupOpen()"
  (closed)="closeNotEnoughPopup()"
>
  <p class="generate-recipe__popup-text">
    Please add at least {{ minIngredients }} ingredients so our AI can create a great recipe.
  </p>
  <button class="generate-recipe__popup-link" type="button" (click)="closeNotEnoughPopup()">
    Go back to ingredients
    <span class="generate-recipe__popup-arrow" aria-hidden="true"></span>
  </button>
</app-popup>
