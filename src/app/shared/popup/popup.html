<dialog
  #dialog
  class="popup"
  [attr.aria-labelledby]="headingId"
  (close)="requestClose()"
  (click)="requestCloseOnBackdropClick($event)"
>
  <div class="popup__box">
    <button class="popup__close-button" type="button" aria-label="Close" (click)="requestClose()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M2 2l12 12M14 2L2 14" />
      </svg>
    </button>
    <h2 class="popup__heading" [id]="headingId">{{ heading() }}</h2>
    <ng-content></ng-content>
  </div>
</dialog>
